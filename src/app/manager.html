<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>browser-browser — Local Files Manager</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
  <link rel="stylesheet" href="../common/theme.css" />
  <link rel="stylesheet" href="../content/content.css" />
  <link rel="stylesheet" href="manager.css" />
</head>
<body class="vwsq-console-shell">
  <div id="vwsq-app" class="vwsq-app-shell">
    <header id="vwsq-topbar" class="vwsq-topbar"></header>
    <div id="vwsq-tabs-bar" class="vwsq-tabs-bar">
      <div class="vwsq-tab active" id="vwsq-tab-main">
        <div style="width: 14px; height: 14px;">
          <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="vwsq-tab-title">Local Workspace</span>
      </div>
      <button class="vwsq-btn vwsq-btn--sm vwsq-btn--ghost vwsq-open-folder-btn" style="padding: 4px 8px;" title="Open Local Folder">
        <span>+ Open Folder</span>
      </button>
      <input type="file" id="vwsq-folder-input" webkitdirectory directory multiple style="display: none;" />
    </div>

    <div class="vwsq-body">
      <aside id="vwsq-sidebar" class="vwsq-warm-rail-sidebar"></aside>
      <main class="vwsq-main-content">
        <div class="vwsq-toolbar">
          <div id="vwsq-stats" class="vwsq-stats">Select or open a local folder to begin</div>
          <div style="display: flex; gap: 8px;">
            <button class="vwsq-btn vwsq-btn--sm vwsq-btn--primary vwsq-open-folder-btn">
              <span>Open Local Folder</span>
            </button>
          </div>
        </div>
        <div id="vwsq-file-container" class="vwsq-file-container">
          <div class="vwsq-empty-workspace">
            <div class="vwsq-dropzone" id="vwsq-dropzone">
              <div style="width: 64px; height: 64px; color: var(--vwsq-iris-400);">
                <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
              </div>
              <div>
                <h3 style="font-size: 18px; margin-bottom: 6px;">Open Local Folder or Drag & Drop Here</h3>
                <p style="font-size: 13px; color: var(--vwsq-console-text-dim);">
                  Browse local directories with instant multi-format preview, search, and Python-Zipper connectivity.
                </p>
              </div>
              <div style="display: flex; gap: 12px; margin-top: 8px;">
                <button class="vwsq-btn vwsq-btn--primary vwsq-open-folder-btn">
                  Choose Folder
                </button>
                <button class="vwsq-btn vwsq-load-sample-btn">
                  Browse Desktop Repos
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="manager.js"></script>
</body>
</html>
