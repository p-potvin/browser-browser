<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11141b" />
      <stop offset="50%" stop-color="#0a0c11" />
      <stop offset="100%" stop-color="#070810" />
    </linearGradient>
    
    <linearGradient id="outerFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e7bf2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#5866dc" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="innerFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a6b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e86f4f" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8189f5" />
      <stop offset="100%" stop-color="#6e7bf2" />
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa88b" />
      <stop offset="100%" stop-color="#ff8a6b" />
    </linearGradient>

    <radialGradient id="irisGlow" cx="25%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#6e7bf2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6e7bf2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coralGlow" cx="80%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ff8a6b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff8a6b" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="irisGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="104" fill="url(#irisGlow)" />
  <rect width="512" height="512" rx="104" fill="url(#coralGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Outer Browser Window (Obsidian Hardware Shell) -->
  <g filter="url(#subtleShadow)">
    <rect x="52" y="56" width="408" height="396" rx="24" fill="#191d27" stroke="url(#outerFrameGrad)" stroke-width="2" />
    
    <!-- Outer Window Header Bar -->
    <path d="M 52 80 Q 52 56 76 56 L 436 56 Q 460 56 460 80 L 460 108 L 52 108 Z" fill="#11141b" />
    <line x1="52" y1="108" x2="460" y2="108" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" />

    <!-- Window Signal LEDs -->
    <circle cx="80" cy="82" r="5.5" fill="#f45d6b" />
    <circle cx="98" cy="82" r="5.5" fill="#e9b054" />
    <circle cx="116" cy="82" r="5.5" fill="#56d98d" />

    <!-- Outer URL / Breadcrumb Bar -->
    <rect x="144" y="68" width="220" height="26" rx="13" fill="#0a0c11" stroke="rgba(110, 123, 242, 0.3)" stroke-width="1" />
    <circle cx="160" cy="81" r="3.5" fill="#6e7bf2" />
    <rect x="174" y="77" width="90" height="8" rx="4" fill="rgba(186, 194, 210, 0.6)" />
    <rect x="272" y="77" width="45" height="8" rx="4" fill="#6e7bf2" fill-opacity="0.8" />

    <!-- Outer Status Indicator -->
    <circle cx="432" cy="82" r="4.5" fill="#56d98d" filter="url(#irisGlowFilter)" />
  </g>

  <!-- Outer Rail Sidebar Elements -->
  <g opacity="0.85">
    <rect x="74" y="128" width="84" height="298" rx="14" fill="#070810" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    <!-- Rail Drive Items -->
    <rect x="86" y="146" width="60" height="18" rx="6" fill="rgba(110, 123, 242, 0.18)" stroke="rgba(110, 123, 242, 0.4)" stroke-width="1" />
    <rect x="86" y="174" width="60" height="14" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <rect x="86" y="196" width="60" height="14" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <rect x="86" y="218" width="60" height="14" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <line x1="86" y1="244" x2="146" y2="244" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="86" y="256" width="60" height="14" rx="4" fill="rgba(255, 138, 107, 0.15)" stroke="rgba(255, 138, 107, 0.3)" stroke-width="1" />
    <rect x="86" y="278" width="60" height="14" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <rect x="86" y="300" width="60" height="14" rx="4" fill="rgba(255, 255, 255, 0.05)" />
  </g>

  <!-- Inner Browser Window ("Browser-Inside-The-Browser") -->
  <g filter="url(#subtleShadow)">
    <rect x="174" y="128" width="262" height="298" rx="18" fill="#11141b" stroke="url(#innerFrameGrad)" stroke-width="2" />

    <!-- Inner Window Titlebar -->
    <path d="M 174 144 Q 174 128 190 128 L 420 128 Q 436 128 436 144 L 436 166 L 174 166 Z" fill="#191d27" />
    <line x1="174" y1="166" x2="436" y2="166" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

    <!-- Inner Window Dots -->
    <circle cx="194" cy="147" r="4" fill="#ff8a6b" />
    <circle cx="206" cy="147" r="4" fill="#ffa88b" opacity="0.6" />
    <circle cx="218" cy="147" r="4" fill="#6e7bf2" opacity="0.6" />

    <!-- Inner Path -->
    <rect x="234" y="137" width="130" height="18" rx="9" fill="#070810" stroke="rgba(255, 138, 107, 0.3)" stroke-width="1" />
    <rect x="246" y="143" width="70" height="6" rx="3" fill="#ff8a6b" fill-opacity="0.9" />

    <!-- Inner Hardware LED -->
    <circle cx="416" cy="147" r="3.5" fill="#56d98d" />

    <!-- File Grid Items inside the inner browser -->
    <!-- Folder Card 1 -->
    <rect x="190" y="182" width="66" height="64" rx="10" fill="#1f2430" stroke="rgba(110, 123, 242, 0.25)" stroke-width="1" />
    <path d="M 202 198 L 214 198 L 219 204 L 244 204 Q 248 204 248 208 L 248 226 Q 248 230 244 230 L 202 230 Q 198 230 198 226 L 198 202 Q 198 198 202 198 Z" fill="url(#irisGrad)" />
    <rect x="200" y="236" width="46" height="4" rx="2" fill="rgba(186, 194, 210, 0.6)" />

    <!-- Folder Card 2 -->
    <rect x="268" y="182" width="66" height="64" rx="10" fill="#1f2430" stroke="rgba(110, 123, 242, 0.25)" stroke-width="1" />
    <path d="M 280 198 L 292 198 L 297 204 L 322 204 Q 326 204 326 208 L 326 226 Q 326 230 322 230 L 280 230 Q 276 230 276 226 L 276 202 Q 276 198 280 198 Z" fill="url(#irisGrad)" />
    <rect x="278" y="236" width="46" height="4" rx="2" fill="rgba(186, 194, 210, 0.6)" />

    <!-- File Card 3 (Code / Document) -->
    <rect x="346" y="182" width="66" height="64" rx="10" fill="#1f2430" stroke="rgba(255, 138, 107, 0.3)" stroke-width="1" />
    <path d="M 364 198 L 386 198 L 394 206 L 394 230 Q 394 233 391 233 L 364 233 Q 361 233 361 230 L 361 201 Q 361 198 364 198 Z" fill="url(#coralGrad)" />
    <polygon points="386,198 394,206 386,206" fill="#ffa88b" />
    <rect x="356" y="236" width="46" height="4" rx="2" fill="#ff8a6b" fill-opacity="0.8" />

    <!-- File Card 4 (Image / Media) -->
    <rect x="190" y="258" width="66" height="64" rx="10" fill="#1f2430" stroke="rgba(86, 217, 141, 0.25)" stroke-width="1" />
    <rect x="202" y="270" width="42" height="34" rx="4" fill="#070810" stroke="#56d98d" stroke-width="1" />
    <circle cx="212" cy="279" r="3" fill="#56d98d" />
    <polygon points="204,298 214,286 226,298" fill="#56d98d" fill-opacity="0.6" />
    <polygon points="222,298 232,289 242,298" fill="#56d98d" fill-opacity="0.8" />
    <rect x="200" y="312" width="46" height="4" rx="2" fill="rgba(186, 194, 210, 0.6)" />

    <!-- File Card 5 (Audio / Sound) -->
    <rect x="268" y="258" width="66" height="64" rx="10" fill="#1f2430" stroke="rgba(165, 133, 245, 0.25)" stroke-width="1" />
    <circle cx="301" cy="286" r="14" fill="#070810" stroke="#a585f5" stroke-width="1" />
    <path d="M 297 278 L 305 278 L 305 291 A 3 3 0 1 1 301 289 L 301 281 L 297 281 Z" fill="#a585f5" />
    <rect x="278" y="312" width="46" height="4" rx="2" fill="rgba(186, 194, 210, 0.6)" />

    <!-- File Card 6 (Archive / Zip) -->
    <rect x="346" y="258" width="66" height="64" rx="10" fill="#1f2430" stroke="rgba(233, 176, 84, 0.25)" stroke-width="1" />
    <rect x="360" y="270" width="38" height="34" rx="4" fill="#070810" stroke="#e9b054" stroke-width="1" />
    <line x1="379" y1="270" x2="379" y2="304" stroke="#e9b054" stroke-width="1.5" stroke-dasharray="3 2" />
    <rect x="375" y="284" width="8" height="6" rx="2" fill="#e9b054" />
    <rect x="356" y="312" width="46" height="4" rx="2" fill="rgba(186, 194, 210, 0.6)" />

    <!-- Status Bar inside the inner window -->
    <rect x="186" y="394" width="238" height="22" rx="6" fill="#070810" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    <circle cx="198" cy="405" r="3" fill="#56d98d" />
    <rect x="208" y="402" width="80" height="6" rx="3" fill="rgba(186, 194, 210, 0.5)" />
    <rect x="372" y="402" width="42" height="6" rx="3" fill="rgba(110, 123, 242, 0.7)" />
  </g>
</svg>
